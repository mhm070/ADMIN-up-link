<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Link Pool</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Reset & Base ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #07090f;
  --surface:     #0d1117;
  --surface-2:   #111827;
  --border:      #1a2235;
  --border-lit:  #243050;
  --text:        #d4ddf0;
  --text-dim:    #4a6080;
  --text-faint:  #1e3050;
  --cyan:        #53d8fb;
  --emerald:     #1ade8f;
  --orange:      #ff6b35;
  --red:         #cc4444;
  --radius-sm:   8px;
  --radius-md:   14px;
  --radius-lg:   18px;
  --glow-em:     0 0 20px #1ade8f28, 0 0 6px #1ade8f18;
  --glow-cy:     0 0 20px #53d8fb28, 0 0 6px #53d8fb18;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 32px 16px 72px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-lit); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--emerald); }

#root { max-width: 580px; margin: 0 auto; }

/* ── Animations ───────────────────────────────────── */
@keyframes fadeUp    { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
@keyframes spin      { to { transform:rotate(360deg); } }
@keyframes pulse     { 0%,100% { opacity:1; } 50% { opacity:.3; } }
@keyframes toastIn   { from { opacity:0; transform:translateX(-50%) translateY(14px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
@keyframes toastOut  { from { opacity:1; transform:translateX(-50%) translateY(0); } to { opacity:0; transform:translateX(-50%) translateY(10px); } }
@keyframes termSlide { from { opacity:0; transform:translateX(-8px); } to { opacity:1; transform:translateX(0); } }
@keyframes glowPulse { 0%,100% { box-shadow: var(--glow-em); } 50% { box-shadow: 0 0 32px #1ade8f42; } }

.fade-up { animation: fadeUp .45s cubic-bezier(.22,.68,0,1.2) both; }

/* ── Spinner ──────────────────────────────────────── */
.spinner {
  width: 32px; height: 32px;
  border: 2.5px solid var(--border-lit);
  border-top-color: var(--emerald);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  box-shadow: var(--glow-em);
}

/* ── Glassmorphism Card ───────────────────────────── */
.card {
  background: linear-gradient(145deg, rgba(13,17,23,.92) 0%, rgba(17,24,39,.80) 100%);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px 20px;
  margin-bottom: 14px;
  box-shadow:
    0 4px 32px rgba(0,0,0,.55),
    0 1px 0 rgba(255,255,255,.03) inset,
    0 -1px 0 rgba(0,0,0,.4) inset;
  position: relative;
  overflow: hidden;
  transition: box-shadow .25s ease, border-color .25s ease;
}
.card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.025) 0%, transparent 60%);
  pointer-events: none;
}
.card:hover {
  border-color: var(--border-lit);
  box-shadow: 0 8px 40px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.04) inset;
}

/* ── Card Title ───────────────────────────────────── */
.card-title {
  font-size: .66rem; font-weight: 700; letter-spacing: .22em;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px;
}
.card-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--border-lit), transparent);
}

/* ── Stat Row ─────────────────────────────────────── */
.stat-row { display: flex; gap: 10px; margin-bottom: 14px; }
.stat-box {
  flex: 1; background: rgba(7,9,15,.7);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 16px 12px; text-align: center;
  transition: border-color .2s, box-shadow .2s;
}
.stat-box:hover { border-color: var(--border-lit); box-shadow: 0 0 24px rgba(0,0,0,.4); }
.stat-num {
  font-size: clamp(30px, 9vw, 42px); font-weight: 900;
  line-height: 1; letter-spacing: -1.5px;
  font-variant-numeric: tabular-nums;
}
.stat-lbl {
  font-size: .62rem; color: var(--text-dim); margin-top: 5px;
  text-transform: uppercase; letter-spacing: .12em; font-weight: 600;
}

/* ── Mode Toggle ──────────────────────────────────── */
.mode-row { display: flex; gap: 8px; margin-bottom: 14px; }
.mode-btn {
  flex: 1; padding: 9px 0; border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif; font-size: .77rem; font-weight: 600;
  cursor: pointer; border: 1px solid var(--border);
  background: transparent; color: var(--text-dim);
  transition: all .18s cubic-bezier(.22,.68,0,1.2);
}
.mode-btn:hover { transform: translateY(-1px) scale(1.02); filter: brightness(1.15); border-color: var(--border-lit); }
.mode-btn:active { transform: scale(.97); }
.mode-btn.on { border-color: rgba(83,216,251,.35); color: var(--cyan); background: rgba(83,216,251,.07); box-shadow: var(--glow-cy); }

/* ── Drop Zone ────────────────────────────────────── */
.dropzone {
  border: 2px dashed var(--border-lit); border-radius: var(--radius-md);
  padding: 40px 20px; text-align: center; cursor: pointer;
  transition: all .22s ease; background: rgba(7,9,15,.5);
}
.dropzone:hover { border-color: var(--emerald); background: rgba(26,222,143,.04); box-shadow: var(--glow-em); }
.dropzone.over  { border-color: var(--cyan); background: rgba(83,216,251,.06); box-shadow: var(--glow-cy); transform: scale(1.01); }
.dropzone.ready { border-color: var(--emerald); background: rgba(26,222,143,.06); box-shadow: var(--glow-em); animation: glowPulse 2s ease-in-out infinite; }
.dropzone input { display: none; }

/* ── Buttons ──────────────────────────────────────── */
.btn {
  width: 100%; padding: 13px 0; border: none; border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif; font-size: .84rem; font-weight: 700;
  cursor: pointer; transition: all .18s cubic-bezier(.22,.68,0,1.2); margin-top: 10px;
}
.btn:hover:not(:disabled)  { transform: translateY(-2px) scale(1.015); filter: brightness(1.1); }
.btn:active:not(:disabled) { transform: translateY(0) scale(.98); filter: brightness(.95); }
.btn-upload {
  background: linear-gradient(135deg, #0f3d28, rgba(26,222,143,.18));
  border: 1px solid rgba(26,222,143,.35); color: var(--emerald); box-shadow: var(--glow-em);
}
.btn-upload:hover:not(:disabled) { box-shadow: 0 0 32px rgba(26,222,143,.45), 0 0 12px rgba(26,222,143,.25); }
.btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-cancel:hover:not(:disabled) { border-color: var(--border-lit); color: var(--text); }
.btn-danger {
  background: transparent; border: 1px solid rgba(204,68,68,.3); color: var(--red);
  width: auto; padding: 5px 14px; font-size: .73rem; border-radius: var(--radius-sm);
  transition: all .18s cubic-bezier(.22,.68,0,1.2);
}
.btn-danger:hover  { background: rgba(204,68,68,.1); border-color: rgba(204,68,68,.6); transform: translateY(-1px) scale(1.04); }
.btn-danger:active { transform: scale(.97); }

/* ── Pool Rows — Terminal ─────────────────────────── */
.pool-row {
  background: #000; border: 1px solid #0d2212; border-radius: var(--radius-sm);
  padding: 12px 15px; display: flex; align-items: flex-start; gap: 12px;
  margin-bottom: 8px; font-family: 'JetBrains Mono', 'Courier New', monospace;
  box-shadow: 0 0 12px rgba(0,0,0,.6) inset;
  transition: border-color .2s, box-shadow .2s;
  animation: termSlide .32s ease both;
}
.pool-row::before {
  content: '>'; color: #1ade8f; font-weight: 600; margin-top: 1px;
  flex-shrink: 0; text-shadow: 0 0 6px rgba(26,222,143,.5);
}
.pool-row:hover { border-color: rgba(26,222,143,.18); box-shadow: 0 0 16px rgba(0,0,0,.7) inset, 0 0 0 1px rgba(26,222,143,.06); }
.pool-sec  { font-family: 'JetBrains Mono', monospace; font-size: .72rem; color: #4ade80; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; text-shadow: 0 0 8px rgba(74,222,128,.4); }
.pool-cnt  { font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: #166534; margin-left: 10px; }
.pool-preview { font-family: 'JetBrains Mono', monospace; font-size: .68rem; color: #15803d; margin-top: 5px; word-break: break-all; line-height: 1.6; }

/* ── Hint Box — Terminal ──────────────────────────── */
.hint-box {
  background: #000; border: 1px solid #0d2212; border-radius: var(--radius-md);
  padding: 18px 20px; box-shadow: 0 0 24px rgba(0,0,0,.5) inset; position: relative;
}
.hint-box::before {
  content: '$ format guide'; display: block;
  font-family: 'JetBrains Mono', monospace; font-size: .64rem;
  color: #166534; letter-spacing: .15em; text-transform: uppercase;
  margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #0d2212;
}
pre { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: .71rem; color: #22c55e; line-height: 2; text-shadow: 0 0 8px rgba(34,197,94,.2); }

/* ── Toast ────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: rgba(13,24,36,.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(26,222,143,.25); color: var(--emerald);
  border-radius: 24px; padding: 10px 24px; font-size: .82rem; font-weight: 600;
  z-index: 999; white-space: nowrap; box-shadow: 0 4px 24px rgba(0,0,0,.6), var(--glow-em);
}
.toast.in  { animation: toastIn  .28s cubic-bezier(.22,.68,0,1.2) both; }
.toast.out { animation: toastOut .22s ease forwards; }

/* ── Live Dot ─────────────────────────────────────── */
.live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--emerald);
  display: inline-block; margin-right: 6px;
  animation: pulse 2s ease-in-out infinite; box-shadow: 0 0 6px rgba(26,222,143,.7);
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const POOL_KEY = "linkpool:sections";

/* ── CẤU HÌNH GITHUB ── */
const REPO_OWNER = "mhm070";
const REPO_NAME = "i-know-i-sharee";
const FILE_PATH = "links.txt";

// Lấy Token động qua prompt để bảo mật
let GITHUB_TOKEN = localStorage.getItem("my_github_token");
if (!GITHUB_TOKEN) {
  GITHUB_TOKEN = prompt("Vui lòng nhập GitHub Token của bạn để truy cập Admin:");
  if (GITHUB_TOKEN) {
    localStorage.setItem("my_github_token", GITHUB_TOKEN);
  }
}

/* parse .txt */
function parseTxt(text) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const sections = {}; let cur = "Default";
  for (const line of lines) {
    const m = line.match(/^\[(.+)\]$/) || line.match(/^##\s+(.+)$/);
    if (m) { cur = m[1].trim(); continue; }
    if (!sections[cur]) sections[cur] = [];
    sections[cur].push(line);
  }
  return sections;
}

/* ── XỬ LÝ LƯU TRỮ GITHUB API ── */

// Hàm 1: Chuyển dữ liệu Object của React thành định dạng file Text chuẩn
function convertPoolToTxt(poolData) {
  if (!poolData) return "";
  let textResult = "";
  for (const [section, links] of Object.entries(poolData)) {
    textResult += `[${section}]\n`;
    links.forEach(link => {
      textResult += `${link}\n`;
    });
    textResult += "\n";
  }
  return textResult.trim();
}

// Hàm 2: Đọc file trực tiếp từ GitHub thông qua API
async function loadPool() {
  const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
  try {
    const response = await fetch(apiUrl, {
      headers: {
        "Authorization": `token ${GITHUB_TOKEN}`,
        "Accept": "application/vnd.github.v3.raw"
      }
    });
    if (!response.ok) return null;
    const textData = await response.text();
    return parseTxt(textData);
  } catch (error) {
    console.error("Lỗi khi kéo dữ liệu từ GitHub:", error);
    return null;
  }
}

// Hàm 3: Ghi đè file lên GitHub
async function savePool(data) {
  const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
  const rawTextContent = data ? convertPoolToTxt(data) : "";
  const base64Content = btoa(unescape(encodeURIComponent(rawTextContent)));

  try {
    let currentSha = null;
    // Bước 1: Lấy mã SHA của file cũ
    const getRes = await fetch(apiUrl, {
      headers: {
        "Authorization": `token ${GITHUB_TOKEN}`,
        "Accept": "application/vnd.github.v3+json"
      }
    });
    if (getRes.ok) {
      const fileMeta = await getRes.json();
      currentSha = fileMeta.sha;
    }

    // Bước 2: Đẩy file mới lên
    const body = {
      message: "Admin update link pool",
      content: base64Content
    };
    if (currentSha) body.sha = currentSha;

    const putRes = await fetch(apiUrl, {
      method: "PUT",
      headers: {
        "Authorization": `token ${GITHUB_TOKEN}`,
        "Content-Type": "application/json",
        "Accept": "application/vnd.github.v3+json"
      },
      body: JSON.stringify(body)
    });

    if (!putRes.ok) throw new Error("GitHub API từ chối cập nhật.");
  } catch (error) {
    console.error("Lỗi khi lưu lên GitHub:", error);
    throw error;
  }
}

/* ── Toast ── */
function Toast({ msg, phase }) {
  if (!msg) return null;
  return <div className={`toast ${phase}`}>{msg}</div>;
}

/* ── Main Admin ── */
function Admin() {
  const [pool, setPool]         = useState(null);
  const [loading, setLoading]   = useState(true);
  const [mode, setMode]         = useState("replace");
  const [dragOver, setDragOver] = useState(false);
  const [preview, setPreview]   = useState(null);
  const [toast, setToast]       = useState({ msg:"", phase:"" });
  const fileRef = useRef();
  const toastTimer = useRef();

  const showToast = (msg) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ msg, phase:"in" });
    toastTimer.current = setTimeout(() => {
      setToast(t => ({ ...t, phase:"out" }));
      setTimeout(() => setToast({ msg:"", phase:"" }), 300);
    }, 2200);
  };

  const refresh = useCallback(async () => {
    const d = await loadPool();
    setPool(d); setLoading(false);
  }, []);

  // Đã gỡ bỏ setInterval để tránh lỗi giới hạn API của GitHub
  useEffect(() => { refresh(); }, [refresh]);

  const processFile = (file) => {
    if (!file?.name.endsWith(".txt")) { showToast("❌ Chỉ nhận file .txt"); return; }
    const reader = new FileReader();
    reader.onload = e => { setPreview({ parsed: parseTxt(e.target.result), fileName: file.name }); };
    reader.readAsText(file);
  };

  const handleUpload = async () => {
    if (!preview) return;
    let newPool;
    if (mode === "replace") {
      newPool = { ...preview.parsed };
    } else {
      const cur = pool || {};
      newPool = { ...cur };
      for (const [sec, links] of Object.entries(preview.parsed)) {
        const set = new Set(newPool[sec] || []);
        links.forEach(l => set.add(l));
        newPool[sec] = [...set];
      }
    }
    await savePool(newPool);
    setPool(newPool);
    setPreview(null);
    const total = Object.values(newPool).reduce((s, a) => s + a.length, 0);
    showToast(`✓ Đã nạp ${total} links vào pool`);
  };

  const delSection = async (sec) => {
    const updated = { ...pool }; delete updated[sec];
    const next = Object.keys(updated).length ? updated : null;
    await savePool(next); setPool(next);
    showToast(`Đã xoá section "${sec}"`);
  };

  const clearAll = async () => {
    await savePool(null); setPool(null);
    showToast("Đã xoá toàn bộ pool");
  };

  const total  = pool ? Object.values(pool).reduce((s, a) => s + a.length, 0) : 0;
  const secCnt = pool ? Object.keys(pool).length : 0;

  if (loading) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div className="spinner"/>
    </div>
  );

  return (
    <>
      <Toast msg={toast.msg} phase={toast.phase} />

      {/* Header */}
      <div className="fade-up" style={{textAlign:"center",marginBottom:28}}>
        <div style={{display:"inline-flex",alignItems:"center",fontSize:".68rem",fontWeight:700,letterSpacing:".2em",textTransform:"uppercase",color:"#ff6b35",background:"#ff6b3512",border:"1px solid #ff6b3530",padding:"4px 14px",borderRadius:20,marginBottom:12}}>
          ⚙ Admin Panel
        </div>
        <h1 style={{fontSize:"clamp(22px,6vw,30px)",fontWeight:900,letterSpacing:"-1px",color:"#eef2ff"}}>Quản lý Link Pool</h1>
        <p style={{color:"#2a4060",fontSize:".82rem",marginTop:6}}>
          <span className="live-dot"/>Kết nối trực tiếp GitHub API
        </p>
      </div>

      {/* Stats */}
      <div className="stat-row fade-up" style={{animationDelay:".05s"}}>
        <div className="stat-box">
          <div className="stat-num" style={{color:"#ff6b35"}}>{total}</div>
          <div className="stat-lbl">Links còn</div>
        </div>
        <div className="stat-box">
          <div className="stat-num" style={{color:"#53d8fb"}}>{secCnt}</div>
          <div className="stat-lbl">Sections</div>
        </div>
      </div>

      {/* Upload */}
      <div className="card fade-up" style={{animationDelay:".1s"}}>
        <div className="card-title">↑ Nạp file link mới</div>

        <div className="mode-row">
          {[["replace","🔄 Thay thế"],["append","➕ Gộp thêm"]].map(([v,l]) => (
            <button key={v} className={`mode-btn ${mode===v?"on":""}`} onClick={() => setMode(v)}>{l}</button>
          ))}
        </div>

        <div
          className={`dropzone${dragOver?" over":""}${preview?" ready":""}`}
          onDragOver={e => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={e => { e.preventDefault(); setDragOver(false); processFile(e.dataTransfer.files[0]); }}
          onClick={() => fileRef.current.click()}
        >
          {preview ? (
            <>
              <div style={{fontSize:32,marginBottom:8}}>📄</div>
              <p style={{fontWeight:700,color:"#1ade8f",marginBottom:4}}>{preview.fileName}</p>
              <p style={{fontSize:".72rem",color:"#3a7a5a"}}>
                {Object.entries(preview.parsed).map(([s,l]) => `${s}: ${l.length}`).join(" · ")} links
              </p>
            </>
          ) : (
            <>
              <div style={{fontSize:36,marginBottom:10}}>📂</div>
              <p style={{color:"#3a6080",fontSize:".85rem"}}>Kéo file .txt vào đây hoặc click để chọn</p>
            </>
          )}
          <input ref={fileRef} type="file" accept=".txt" onChange={e => processFile(e.target.files[0])} />
        </div>

        {preview && (
          <div style={{display:"flex",gap:8,marginTop:10}}>
            <button className="btn btn-upload" style={{margin:0}} onClick={handleUpload}>
              ↑ Nạp vào pool ({mode === "replace" ? "thay thế" : "gộp thêm"})
            </button>
            <button className="btn btn-cancel" style={{margin:0,width:"auto",padding:"0 18px"}} onClick={() => setPreview(null)}>Huỷ</button>
          </div>
        )}
      </div>

      {/* Current pool */}
      {pool && secCnt > 0 && (
        <div className="card fade-up" style={{animationDelay:".15s"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div className="card-title" style={{margin:0}}>📋 Pool hiện tại</div>
            <button className="btn-danger" onClick={clearAll}>Xoá tất cả</button>
          </div>
          {Object.entries(pool).map(([sec, links]) => (
            <div className="pool-row" key={sec}>
              <div style={{flex:1}}>
                <span className="pool-sec">{sec}</span>
                <span className="pool-cnt">{links.length} links</span>
                <div className="pool-preview">
                  {links[0] || "—"}
                  {links.length > 1 && <span style={{color:"#1c3040"}}> +{links.length-1} nữa</span>}
                </div>
              </div>
              <button className="btn-danger" onClick={() => delSection(sec)}>Xoá</button>
            </div>
          ))}
        </div>
      )}

      {/* Format hint */}
      <div className="hint-box fade-up" style={{animationDelay:".2s"}}>
        <p style={{fontSize:".68rem",color:"#1e3050",textTransform:"uppercase",letterSpacing:".15em",marginBottom:10,fontWeight:700}}>Format file .txt</p>
        <pre>{`[Spotify Premium]
https://gist.github.com/user/abc123/raw/spotify.conf
https://gist.github.com/user/xyz456/raw/spotify2.conf
