<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Link Pool</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--bdr:#1a2235;--bdr-l:#243050;
  --txt:#d4ddf0;--dim:#4a6080;
  --cy:#53d8fb;--em:#1ade8f;--or:#ff6b35;--red:#cc4444;
  --gem:0 0 20px #1ade8f28,0 0 6px #1ade8f18;
}
html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--txt);
  min-height:100vh;padding:28px 16px 72px;-webkit-font-smoothing:antialiased}
#app{max-width:620px;margin:0 auto}

@keyframes fadeUp  {from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin    {to{transform:rotate(360deg)}}
@keyframes pulse   {0%,100%{opacity:1}50%{opacity:.3}}
@keyframes toastIn {from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(-50%) translateY(8px)}}
@keyframes slideIn {from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow    {0%,100%{box-shadow:var(--gem)}50%{box-shadow:0 0 32px #1ade8f42}}

.fu{animation:fadeUp .4s cubic-bezier(.22,.68,0,1.2) both}
.spinner{width:30px;height:30px;border:2.5px solid var(--bdr-l);border-top-color:var(--em);border-radius:50%;animation:spin .7s linear infinite}

.card{background:linear-gradient(145deg,rgba(13,17,23,.95),rgba(17,24,39,.82));
  border:1px solid var(--bdr);border-radius:18px;padding:22px 20px;margin-bottom:14px;
  box-shadow:0 4px 32px rgba(0,0,0,.5);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.02),transparent 60%);pointer-events:none}
.card:hover{border-color:var(--bdr-l)}

.ct{font-size:.65rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.ct::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bdr-l),transparent)}

.srow{display:flex;gap:10px;margin-bottom:14px}
.sbox{flex:1;background:rgba(7,9,15,.7);border:1px solid var(--bdr);border-radius:14px;padding:16px 12px;text-align:center}
.snum{font-size:clamp(28px,8vw,40px);font-weight:900;line-height:1;letter-spacing:-1.5px}
.slbl{font-size:.62rem;color:var(--dim);margin-top:5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}

.mrow{display:flex;gap:8px;margin-bottom:14px}
.mbtn{flex:1;padding:9px 0;border-radius:8px;font-family:inherit;font-size:.77rem;font-weight:600;
  cursor:pointer;border:1px solid var(--bdr);background:transparent;color:var(--dim);transition:all .18s}
.mbtn.on{border-color:rgba(83,216,251,.35);color:var(--cy);background:rgba(83,216,251,.07);box-shadow:0 0 14px #53d8fb18}

.dz{border:2px dashed var(--bdr-l);border-radius:14px;padding:38px 20px;text-align:center;
  cursor:pointer;transition:all .2s;background:rgba(7,9,15,.5)}
.dz:hover,.dz.over{border-color:var(--em);background:rgba(26,222,143,.04);box-shadow:var(--gem)}
.dz.ready{border-color:var(--em);animation:glow 2s ease-in-out infinite}
.dz input{display:none}

.btn{display:block;width:100%;padding:13px 0;border:none;border-radius:8px;font-family:inherit;
  font-size:.84rem;font-weight:700;cursor:pointer;transition:all .18s;margin-top:10px;text-align:center}
.btn:hover:not([disabled]){transform:translateY(-2px);filter:brightness(1.1)}
.btn:active:not([disabled]){transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.bu{background:linear-gradient(135deg,#0f3d28,rgba(26,222,143,.18));border:1px solid rgba(26,222,143,.35);color:var(--em);box-shadow:var(--gem)}
.bc{background:transparent;border:1px solid var(--bdr);color:var(--dim)}
.bd{background:transparent;border:1px solid rgba(204,68,68,.3);color:var(--red);
  padding:5px 14px;font-size:.72rem;border-radius:7px;cursor:pointer;font-family:inherit;transition:all .18s}
.bd:hover:not([disabled]){background:rgba(204,68,68,.1);border-color:var(--red)}
.bd[disabled]{opacity:.35;cursor:not-allowed}

/* ── Section expandable ── */
.sec-block{border:1px solid var(--bdr);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.sec-block:hover{border-color:var(--bdr-l)}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;
  cursor:pointer;background:rgba(0,0,0,.4);gap:10px;user-select:none}
.sec-hdr:hover{background:rgba(0,0,0,.55)}
.sec-name{font-family:monospace;font-size:.74rem;color:#4ade80;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.sec-cnt{font-family:monospace;font-size:.68rem;color:#166534;margin-left:8px}
.sec-arrow{font-size:.7rem;color:var(--dim);transition:transform .26s;line-height:1;flex-shrink:0}
.sec-arrow.open{transform:rotate(180deg)}
.sec-body{background:#000;border-top:1px solid #0d2212;animation:slideIn .22s ease both}
.link-row{display:flex;align-items:flex-start;gap:10px;padding:9px 15px;border-bottom:1px solid #080f08;transition:background .12s}
.link-row:last-child{border-bottom:none}
.link-row:hover{background:#050d05}
.link-idx{font-family:monospace;font-size:.64rem;color:#1a5c2a;width:20px;text-align:right;flex-shrink:0;padding-top:2px}
.link-url{font-family:monospace;font-size:.69rem;color:#22c55e;flex:1;word-break:break-all;line-height:1.6}
.link-del{background:transparent;border:1px solid rgba(204,68,68,.2);color:rgba(204,68,68,.5);
  border-radius:5px;padding:2px 9px;font-size:.65rem;cursor:pointer;flex-shrink:0;
  transition:all .14s;font-family:inherit;margin-top:1px}
.link-del:hover:not([disabled]){background:rgba(204,68,68,.12);border-color:var(--red);color:var(--red)}
.link-del[disabled]{opacity:.3;cursor:not-allowed}
.sec-foot{display:flex;justify-content:space-between;padding:8px 15px;
  background:#020a02;border-top:1px solid #0d2212}

.hb{background:#000;border:1px solid #0d2212;border-radius:12px;padding:18px 20px}
.hb::before{content:'$ format guide';display:block;font-family:monospace;font-size:.63rem;
  color:#166534;letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;
  padding-bottom:8px;border-bottom:1px solid #0d2212}
pre{font-family:monospace;font-size:.7rem;color:#22c55e;line-height:2}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:rgba(12,22,34,.96);backdrop-filter:blur(12px);
  border:1px solid rgba(26,222,143,.25);color:var(--em);
  border-radius:24px;padding:9px 22px;font-size:.82rem;font-weight:600;z-index:999;white-space:nowrap}
.toast.in {animation:toastIn  .28s cubic-bezier(.22,.68,0,1.2) both}
.toast.out{animation:toastOut .22s ease forwards}

.ld{width:6px;height:6px;border-radius:50%;background:var(--em);
  display:inline-block;margin-right:6px;animation:pulse 2s ease-in-out infinite;vertical-align:middle}
.ti{background:#000;border:1px solid var(--bdr-l);border-radius:8px;
  padding:12px 14px;color:var(--txt);font-family:monospace;font-size:.82rem;
  outline:none;transition:border-color .2s;width:100%;margin:16px 0 10px}
.ti:focus{border-color:var(--em);box-shadow:var(--gem)}
.center{display:flex;align-items:center;justify-content:center;min-height:80vh}
.row{display:flex;gap:8px;margin-top:10px}
.badge{font-size:.67rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  padding:4px 14px;border-radius:20px;display:inline-block}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const REPO_OWNER = 'mhm070';
const REPO_NAME  = 'i-know-i-sharee';
const FILE_PATH  = 'links.txt';
const TOKEN_KEY  = 'goc-share:gh-token';

// ── Helpers ──────────────────────────────────────────────────────────────────
function parseTxt(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const out = {}; let cur = 'Default';
  for (const line of lines) {
    const m = line.match(/^\[(.+)\]$/) || line.match(/^##\s+(.+)$/);
    if (m) { cur = m[1].trim(); continue; }
    if (!out[cur]) out[cur] = [];
    out[cur].push(line);
  }
  return out;
}
function poolToTxt(pool) {
  return Object.entries(pool).map(([s, ls]) => `[${s}]\n${ls.join('\n')}`).join('\n\n').trim();
}
const apiUrl = () => `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

async function loadPool(token) {
  const res = await fetch(apiUrl(), {
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3.raw' }
  });
  if (!res.ok) return null;
  return parseTxt(await res.text());
}
async function savePool(pool, token) {
  const content = btoa(unescape(encodeURIComponent(pool ? poolToTxt(pool) : '')));
  let sha;
  try {
    const r = await fetch(apiUrl(), { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } });
    if (r.ok) sha = (await r.json()).sha;
  } catch {}
  const body = { message: 'admin: update pool', content };
  if (sha) body.sha = sha;
  const res = await fetch(apiUrl(), {
    method: 'PUT',
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`GitHub ${res.status}`);
}

// ── State ─────────────────────────────────────────────────────────────────────
let state = {
  token: localStorage.getItem(TOKEN_KEY) || '',
  pool: null,
  loading: true,
  saving: false,
  mode: 'replace',      // 'replace' | 'append'
  preview: null,        // { parsed, fileName }
  dragOver: false,
  expanded: {},         // { [secName]: bool }
  toast: { msg: '', phase: '' },
};
let toastTimer = null;

function setState(patch) {
  Object.assign(state, typeof patch === 'function' ? patch(state) : patch);
  render();
}

function showToast(msg) {
  if (toastTimer) clearTimeout(toastTimer);
  setState({ toast: { msg, phase: 'in' } });
  toastTimer = setTimeout(() => {
    setState({ toast: { msg, phase: 'out' } });
    setTimeout(() => setState({ toast: { msg: '', phase: '' } }), 280);
  }, 2400);
}

// ── GitHub ops ────────────────────────────────────────────────────────────────
async function persist(newPool) {
  setState({ saving: true });
  try {
    await savePool(newPool, state.token);
    setState({ pool: newPool, saving: false });
  } catch (e) {
    setState({ saving: false });
    showToast('❌ ' + (e.message || 'Lỗi khi lưu'));
  }
}

async function delLink(sec, idx) {
  const updated = {};
  for (const [k, v] of Object.entries(state.pool)) updated[k] = [...v];
  updated[sec] = updated[sec].filter((_, i) => i !== idx);
  if (updated[sec].length === 0) delete updated[sec];
  const next = Object.keys(updated).length ? updated : null;
  await persist(next);
  showToast(`Đã xoá link #${idx + 1} khỏi "${sec}"`);
}

async function delSection(sec) {
  const updated = {};
  for (const [k, v] of Object.entries(state.pool)) updated[k] = [...v];
  delete updated[sec];
  const next = Object.keys(updated).length ? updated : null;
  await persist(next);
  showToast(`Đã xoá section "${sec}"`);
}

async function clearAll() {
  await persist(null);
  showToast('Đã xoá toàn bộ pool');
}

async function doUpload() {
  const { preview, mode, pool, token } = state;
  if (!preview) return;
  let newPool;
  if (mode === 'replace') {
    newPool = { ...preview.parsed };
  } else {
    newPool = {};
    for (const [k, v] of Object.entries(pool || {})) newPool[k] = [...v];
    for (const [sec, links] of Object.entries(preview.parsed)) {
      const s = new Set(newPool[sec] || []);
      links.forEach(l => s.add(l));
      newPool[sec] = [...s];
    }
  }
  await persist(newPool);
  const total = Object.values(newPool).reduce((s, a) => s + a.length, 0);
  setState({ preview: null });
  showToast(`✓ Đã nạp ${total} links lên GitHub`);
}

async function verifyToken(token) {
  setState({ loading: true });
  const pool = await loadPool(token);
  if (pool === null) {
    setState({ loading: false });
    showToast('❌ Token không hợp lệ hoặc không có quyền truy cập');
    return;
  }
  localStorage.setItem(TOKEN_KEY, token);
  setState({ token, pool, loading: false });
}

async function initLoad() {
  if (!state.token) { setState({ loading: false }); return; }
  const pool = await loadPool(state.token);
  if (pool === null) {
    localStorage.removeItem(TOKEN_KEY);
    setState({ token: '', pool: null, loading: false });
    return;
  }
  setState({ pool, loading: false });
}

// ── File handling ─────────────────────────────────────────────────────────────
function processFile(file) {
  if (!file || !file.name.endsWith('.txt')) { showToast('❌ Chỉ nhận file .txt'); return; }
  const reader = new FileReader();
  reader.onload = e => setState({ preview: { parsed: parseTxt(e.target.result), fileName: file.name } });
  reader.readAsText(file);
}

// ── Render ────────────────────────────────────────────────────────────────────
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k === 'disabled') { if (v) node.disabled = true; }
    else if (k === 'type') node.type = v;
    else if (k === 'placeholder') node.placeholder = v;
    else if (k === 'accept') node.accept = v;
    else if (k === 'value') node.value = v;
    else node.setAttribute(k, v);
  }
  for (const child of children.flat()) {
    if (child == null) continue;
    node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return node;
}

function renderTokenGate() {
  let tokenVal = '';
  const input = el('input', { className: 'ti', type: 'password', placeholder: 'ghp_xxxxxxxxxxxxxxxxxxxx' });
  input.addEventListener('input', e => tokenVal = e.target.value);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') verifyToken(tokenVal.trim()); });

  const errEl = el('p', { style: { fontSize: '.74rem', color: 'var(--red)', marginBottom: '8px', minHeight: '18px' } });

  const btn = el('button', { className: 'btn bu', style: { margin: 0 },
    onClick: () => verifyToken(tokenVal.trim()) }, 'Xác nhận & Tiếp tục →');

  return el('div', { className: 'fu center' },
    el('div', { style: { background: '#000', border: '1px solid #0d2212', borderRadius: '18px', padding: '36px 24px', textAlign: 'center', width: '100%' } },
      el('div', { className: 'badge', style: { color: 'var(--or)', background: '#ff6b3512', border: '1px solid #ff6b3530', marginBottom: '16px' } }, '⚙ Admin Panel'),
      el('h2', { style: { fontSize: '20px', fontWeight: 900, color: '#eef2ff', marginBottom: '8px' } }, 'Nhập GitHub Token'),
      el('p', { style: { fontSize: '.78rem', color: 'var(--dim)' } },
        `Token cần quyền repo · ${REPO_OWNER}/${REPO_NAME}`),
      input, errEl, btn,
      el('p', { style: { fontSize: '.68rem', color: '#1e3050', marginTop: '12px' } },
        'Token lưu trong localStorage, không gửi đi đâu khác.')
    )
  );
}

function renderSectionBlock(sec, links) {
  const isOpen = !!state.expanded[sec];
  const block = el('div', { className: 'sec-block' });

  // Header
  const arrow = el('span', { className: `sec-arrow ${isOpen ? 'open' : ''}` }, '▼');
  const hdr = el('div', { className: 'sec-hdr',
    onClick: () => {
      setState({ expanded: { ...state.expanded, [sec]: !state.expanded[sec] } });
    }
  },
    el('div', { style: { display: 'flex', alignItems: 'center', flex: '1', minWidth: '0' } },
      el('span', { style: { color: 'var(--em)', marginRight: '8px', fontSize: '.8rem' } }, '▶'),
      el('span', { className: 'sec-name' }, sec),
      el('span', { className: 'sec-cnt' }, `${links.length} links`)
    ),
    el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
      el('button', { className: 'bd',
        style: { padding: '3px 11px', fontSize: '.67rem' },
        disabled: state.saving,
        onClick: e => { e.stopPropagation(); delSection(sec); }
      }, 'Xoá section'),
      arrow
    )
  );
  block.appendChild(hdr);

  // Body
  if (isOpen) {
    const body = el('div', { className: 'sec-body' });
    links.forEach((url, i) => {
      body.appendChild(el('div', { className: 'link-row' },
        el('span', { className: 'link-idx' }, String(i + 1)),
        el('span', { className: 'link-url' }, url),
        el('button', { className: 'link-del', disabled: state.saving,
          onClick: () => delLink(sec, i)
        }, '✕')
      ));
    });
    body.appendChild(
      el('div', { className: 'sec-foot' },
        el('span', { style: { fontSize: '.64rem', color: '#166534', fontFamily: 'monospace' } }, `${links.length} links`),
        el('span', { style: { fontSize: '.64rem', color: '#0a3a1a', fontFamily: 'monospace' } }, 'nhấn ✕ để xoá từng link')
      )
    );
    block.appendChild(body);
  }
  return block;
}

function renderAdminPanel() {
  const { pool, saving, mode, preview, dragOver } = state;
  const total  = pool ? Object.values(pool).reduce((s, a) => s + a.length, 0) : 0;
  const secCnt = pool ? Object.keys(pool).length : 0;

  const frag = document.createDocumentFragment();

  // ── Header
  const hdr = el('div', { className: 'fu', style: { marginBottom: '28px' } },
    el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' } },
      el('div', { className: 'badge', style: { color: 'var(--or)', background: '#ff6b3512', border: '1px solid #ff6b3530' } }, '⚙ Admin Panel'),
      el('button', { style: { background: 'transparent', border: '1px solid var(--bdr)', color: 'var(--dim)', borderRadius: '8px', padding: '5px 12px', fontSize: '.72rem', cursor: 'pointer', fontFamily: 'inherit' },
        onClick: () => { localStorage.removeItem(TOKEN_KEY); setState({ token: '', pool: null, loading: false }); }
      }, 'Đổi token')
    ),
    el('h1', { style: { fontSize: 'clamp(22px,5vw,28px)', fontWeight: 900, letterSpacing: '-1px', color: '#eef2ff' } }, 'Quản lý Link Pool'),
    el('p', { style: { color: 'var(--dim)', fontSize: '.8rem', marginTop: '6px' } },
      el('span', { className: 'ld' }),
      `${REPO_OWNER}/${REPO_NAME} · ${FILE_PATH}`,
      ...(saving ? [el('span', { style: { color: 'var(--or)', marginLeft: '8px' } }, 'đang lưu…')] : [])
    )
  );
  frag.appendChild(hdr);

  // ── Stats
  frag.appendChild(el('div', { className: 'srow fu', style: { animationDelay: '.05s' } },
    el('div', { className: 'sbox' },
      el('div', { className: 'snum', style: { color: 'var(--or)' } }, String(total)),
      el('div', { className: 'slbl' }, 'Links còn')
    ),
    el('div', { className: 'sbox' },
      el('div', { className: 'snum', style: { color: 'var(--cy)' } }, String(secCnt)),
      el('div', { className: 'slbl' }, 'Sections')
    )
  ));

  // ── Upload card
  const fileInput = el('input', { type: 'file', accept: '.txt', style: { display: 'none' } });
  fileInput.addEventListener('change', e => processFile(e.target.files[0]));

  const dz = el('div', {
    className: `dz${dragOver ? ' over' : ''}${preview ? ' ready' : ''}`,
    onClick: () => fileInput.click()
  },
    ...(preview
      ? [el('div', { style: { fontSize: '30px', marginBottom: '8px' } }, '📄'),
         el('p', { style: { fontWeight: 700, color: 'var(--em)', marginBottom: '4px' } }, preview.fileName),
         el('p', { style: { fontSize: '.72rem', color: '#3a7a5a' } },
           Object.entries(preview.parsed).map(([s, l]) => `${s}: ${l.length}`).join(' · ') + ' links')]
      : [el('div', { style: { fontSize: '34px', marginBottom: '10px' } }, '📂'),
         el('p', { style: { color: 'var(--dim)', fontSize: '.85rem' } }, 'Kéo file .txt vào đây hoặc click để chọn')]
    ),
    fileInput
  );
  dz.addEventListener('dragover', e => { e.preventDefault(); setState({ dragOver: true }); });
  dz.addEventListener('dragleave', () => setState({ dragOver: false }));
  dz.addEventListener('drop', e => { e.preventDefault(); setState({ dragOver: false }); processFile(e.dataTransfer.files[0]); });

  const uploadCard = el('div', { className: 'card fu', style: { animationDelay: '.1s' } },
    el('div', { className: 'ct' }, '↑ Nạp file link mới'),
    el('div', { className: 'mrow' },
      el('button', { className: `mbtn ${mode === 'replace' ? 'on' : ''}`, onClick: () => setState({ mode: 'replace' }) }, '🔄 Thay thế'),
      el('button', { className: `mbtn ${mode === 'append' ? 'on' : ''}`, onClick: () => setState({ mode: 'append' }) }, '➕ Gộp thêm')
    ),
    dz,
    ...(preview ? [
      el('div', { className: 'row' },
        el('button', { className: 'btn bu', style: { margin: 0, flex: 1 }, disabled: saving, onClick: doUpload },
          saving ? 'Đang lưu…' : `↑ Nạp (${mode === 'replace' ? 'thay thế' : 'gộp thêm'})`),
        el('button', { className: 'btn bc', style: { margin: 0, width: 'auto', padding: '0 18px' },
          onClick: () => setState({ preview: null }) }, 'Huỷ')
      )
    ] : [])
  );
  frag.appendChild(uploadCard);

  // ── Pool card
  if (pool && secCnt > 0) {
    const poolCard = el('div', { className: 'card fu', style: { animationDelay: '.15s' } },
      el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' } },
        el('div', { className: 'ct', style: { margin: 0 } }, '📋 Pool hiện tại'),
        el('button', { className: 'bd', disabled: saving, onClick: clearAll }, 'Xoá tất cả')
      ),
      el('p', { style: { fontSize: '.69rem', color: '#1e4030', marginBottom: '12px', fontFamily: 'monospace' } },
        '▶ Nhấn vào section để mở rộng & xoá từng link'),
      ...Object.entries(pool).map(([sec, links]) => renderSectionBlock(sec, links))
    );
    frag.appendChild(poolCard);
  }

  // ── Format hint
  const hint = el('div', { className: 'hb fu', style: { animationDelay: '.2s' } });
  const pre = document.createElement('pre');
  pre.textContent = `[Spotify Premium]\nhttps://gist.github.com/user/abc/raw/file.conf\nhttps://gist.github.com/user/xyz/raw/file2.conf\n\n[Locket Gold]\nhttps://gist.github.com/user/lk/raw/locket.conf`;
  hint.appendChild(pre);
  hint.appendChild(el('p', { style: { fontSize: '.69rem', color: '#1e3050', marginTop: '10px' } }, 'Không có section → vào "Default".'));
  frag.appendChild(hint);

  return frag;
}

function renderToast() {
  const { msg, phase } = state.toast;
  if (!msg) return null;
  return el('div', { className: `toast ${phase}` }, msg);
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const toast = renderToast();
  if (toast) document.body.appendChild(toast);
  else {
    const old = document.querySelector('.toast');
    if (old) old.remove();
  }

  if (state.loading) {
    app.appendChild(el('div', { className: 'center' }, el('div', { className: 'spinner' })));
    return;
  }

  if (!state.token) {
    app.appendChild(renderTokenGate());
    return;
  }

  const panel = document.createDocumentFragment();
  panel.appendChild(renderAdminPanel());
  app.appendChild(panel);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
render();
initLoad();
</script>
</body>
</html>
