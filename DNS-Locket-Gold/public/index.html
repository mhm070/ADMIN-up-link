<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HShare LocketGold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:          #050c1a;
            --bg-2:        #080f1f;
            --card-bg:     rgba(13, 22, 45, 0.85);
            --glass-border:rgba(56, 120, 255, 0.18);
            --text-main:   #e8f0ff;
            --text-muted:  #6b82a8;
            --accent:      #3b7fff;
            --accent-glow: rgba(59, 127, 255, 0.35);
            --accent-hover:#5a9aff;
            --success:     #10d98a;
            --success-glow:rgba(16, 217, 138, 0.3);
            --success-hover:#0fbf78;
            --preview-bg:  #6c3bff;
            --preview-hover:#8155ff;
            --danger:      #ef4444;
            --terminal-bg: #000000;
            --neon-green:  #00ff88;
            --neon-dim:    #00b85f;
        }

        html, body {
            min-height: 100vh;
            width: 100%;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(59,127,255,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 110%, rgba(108,59,255,0.10) 0%, transparent 60%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .page-wrapper {
            width: 100%;
            max-width: 580px;
        }

        /* ── Header ── */
        .app-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .app-header .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(59,127,255,0.1);
            border: 1px solid rgba(59,127,255,0.25);
            border-radius: 20px;
            padding: 4px 14px;
            margin-bottom: 14px;
        }
        .app-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            line-height: 1.2;
        }
        .app-header h1 span {
            background: linear-gradient(135deg, #3b7fff, #10d98a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-header p {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ── Card ── */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 4px 6px rgba(0,0,0,0.4),
                0 20px 60px rgba(0,0,0,0.5),
                0 0 80px rgba(59,127,255,0.04);
            width: 100%;
        }

        /* ── Form Groups ── */
        .form-group { margin-bottom: 20px; }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        label .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            box-shadow: 0 0 6px var(--accent);
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(5, 12, 26, 0.8);
            border: 1px solid rgba(56, 100, 180, 0.2);
            color: var(--text-main);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            appearance: none;
        }
        textarea {
            resize: vertical;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(5, 12, 26, 0.95);
            box-shadow: 0 0 0 3px var(--accent-glow), 0 0 20px rgba(59,127,255,0.08);
        }
        input::placeholder, textarea::placeholder { color: rgba(107,130,168,0.5); }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
            margin: 24px 0;
        }

        /* ── Buttons ── */
        button {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            padding: 14px 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease, background 0.2s ease;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }
        button::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.06);
            opacity: 0;
            transition: opacity 0.2s ease;
            border-radius: inherit;
        }
        button:hover:not(:disabled)::after { opacity: 1; }
        button:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.015);
            filter: brightness(1.12);
        }
        button:active:not(:disabled) {
            transform: translateY(0) scale(0.99);
            filter: brightness(0.95);
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            animation: pulse 2s infinite;
        }

        #startBtn {
            background: linear-gradient(135deg, #2563eb, #3b7fff);
            color: #fff;
            box-shadow: 0 4px 20px rgba(59,127,255,0.35), 0 0 0 1px rgba(59,127,255,0.2) inset;
            font-size: 15px;
            padding: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #startBtn:hover:not(:disabled) {
            box-shadow: 0 6px 30px rgba(59,127,255,0.5), 0 0 0 1px rgba(59,127,255,0.3) inset;
        }

        .btn-success {
            background: linear-gradient(135deg, #059669, #10d98a);
            color: #fff;
            box-shadow: 0 4px 18px rgba(16,217,138,0.3);
        }
        .btn-success:hover:not(:disabled) {
            box-shadow: 0 6px 26px rgba(16,217,138,0.45);
        }

        .btn-preview {
            background: linear-gradient(135deg, #5b21b6, #6c3bff);
            color: #fff;
            box-shadow: 0 4px 18px rgba(108,59,255,0.3);
        }
        .btn-preview:hover:not(:disabled) {
            box-shadow: 0 6px 26px rgba(108,59,255,0.45);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.55; }
            50%       { opacity: 0.35; }
        }

        /* ── Terminal Log ── */
        .terminal-wrapper {
            margin-top: 26px;
        }
        .terminal-header {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #111;
            border: 1px solid #1e2a1e;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            padding: 9px 14px;
        }
        .terminal-dot {
            width: 11px; height: 11px;
            border-radius: 50%;
        }
        .td-red    { background: #ff5f57; }
        .td-yellow { background: #febc2e; }
        .td-green  { background: #28c840; }
        .terminal-title {
            flex: 1;
            text-align: center;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: #4a5a4a;
            letter-spacing: 0.5px;
            margin-right: 30px;
        }

        #logBox {
            background: var(--terminal-bg);
            color: var(--neon-green);
            font-family: 'JetBrains Mono', monospace;
            padding: 16px 18px;
            height: 260px;
            overflow-y: auto;
            border-radius: 0 0 10px 10px;
            border: 1px solid #1e2a1e;
            font-size: 12.5px;
            line-height: 1.65;
            scroll-behavior: smooth;
            text-shadow: 0 0 8px rgba(0,255,136,0.4);
        }
        #logBox::-webkit-scrollbar { width: 5px; }
        #logBox::-webkit-scrollbar-track { background: #0a0a0a; }
        #logBox::-webkit-scrollbar-thumb { background: #1a3a2a; border-radius: 3px; }
        #logBox::-webkit-scrollbar-thumb:hover { background: #2a5a3a; }

        .log-entry {
            animation: logFadeIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(8px);
            margin-bottom: 2px;
        }
        @keyframes logFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Action Buttons ── */
        .action-buttons {
            display: none;
            margin-top: 20px;
            gap: 10px;
            flex-direction: column;
        }

        /* ── Preview Container ── */
        #previewContainer {
            margin-top: 18px;
            display: none;
            background: rgba(5, 12, 26, 0.9);
            border: 1px solid var(--glass-border);
            padding: 18px;
            border-radius: 10px;
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.7;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .card { padding: 24px 18px; border-radius: 16px; }
            .app-header h1 { font-size: 22px; }
            #logBox { height: 200px; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">

        <div class="app-header">
            <div class="badge">Automation Suite</div>
            <h1>Locket Gold <span>DNS</span></h1>
            <p>Professional NextDNS account automation tool</p>
        </div>

        <div class="card">

            <div class="form-group">
                <label><span class="dot"></span>Password (Min 8 chars)</label>
                <input type="text" id="passwordInput" value="helloae123" required placeholder="Enter account password…">
            </div>

            <div class="form-group">
                <label><span class="dot"></span>Number of Accounts</label>
                <input type="number" id="countInput" value="1" min="1" max="10" required>
            </div>

            <div class="form-group">
                <label><span class="dot"></span>Denylist (1 per line)</label>
                <textarea id="domainsInput" rows="3" placeholder="api.revenuecat.com&#10;example.com">api.revenuecat.com&#10;firebaseremoteconfig.googleapis.com</textarea>
            </div>

            <div class="divider"></div>

            <button id="startBtn" onclick="startProcess()">⚡ Start Automation</button>

            <div class="terminal-wrapper">
                <div class="terminal-header">
                    <span class="terminal-dot td-red"></span>
                    <span class="terminal-dot td-yellow"></span>
                    <span class="terminal-dot td-green"></span>
                    <span class="terminal-title">automation — log</span>
                </div>
                <div id="logBox">Awaiting configuration...</div>
            </div>

            <div class="action-buttons" id="actionButtons">
                <button class="btn-success" onclick="downloadAccounts()">⬇ Download Accounts &amp; Passwords</button>
                <button class="btn-success" onclick="downloadLinks()">⬇ Download Links Only</button>
                <button class="btn-preview" onclick="previewAccounts()">👁 Preview Accounts</button>
            </div>

            <div id="previewContainer"></div>

        </div>

    </div>

    <script>
        let generatedAccounts = [];

        function startProcess() {
            const pwd = document.getElementById('passwordInput').value;
            const count = document.getElementById('countInput').value;
            const domains = document.getElementById('domainsInput').value;
            const logBox = document.getElementById('logBox');
            const startBtn = document.getElementById('startBtn');
            const actionButtons = document.getElementById('actionButtons');
            const previewContainer = document.getElementById('previewContainer');

            if(pwd.length < 8) { alert('Password must be at least 8 characters!'); return; }

            // Reset UI states
            logBox.innerHTML = '';
            actionButtons.style.display = 'none';
            previewContainer.style.display = 'none';
            startBtn.disabled = true;
            generatedAccounts = [];

            const url = `/automation/run?password=${encodeURIComponent(pwd)}&count=${count}&domains=${encodeURIComponent(domains)}`;
            const eventSource = new EventSource(url);

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.type === 'log') {
                    logBox.innerHTML += `<div class="log-entry">${data.message}</div>`;
                    logBox.scrollTop = logBox.scrollHeight;
                } 
                else if (data.type === 'account') {
                    generatedAccounts.push(data.data);
                    actionButtons.style.display = 'flex';
                }
                else if (data.type === 'done') {
                    logBox.innerHTML += '<div class="log-entry" style="color: var(--success);">\n=== AUTOMATION COMPLETED ===</div>\n';
                    logBox.scrollTop = logBox.scrollHeight;
                    startBtn.disabled = false;
                    eventSource.close();
                }
                else if (data.type === 'failed') {
                    logBox.innerHTML += `<div class="log-entry" style="color: #ef4444;">\nAutomation failed: ${data.message}</div>\n`;
                    logBox.scrollTop = logBox.scrollHeight;
                    startBtn.disabled = false;
                    eventSource.close();
                }
            };

            eventSource.onerror = function() {
                logBox.innerHTML += '<div class="log-entry" style="color: #ef4444;">\nConnection to server lost or interrupted. But your processed accounts are saved!</div>\n';
                startBtn.disabled = false;
                eventSource.close();
            };
        }

        function downloadAccounts() {
            let fileContent = '[Accounts Data]\n';

            generatedAccounts.forEach((acc) => {
                if(acc.email && acc.password) {
                    fileContent += `${acc.email} | ${acc.password}\n`;
                }
            });

            const blob = new Blob([fileContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Accounts_And_Passwords.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function downloadLinks() {
            let fileContent = '[Locket Gold]\n';

            generatedAccounts.forEach((acc) => {
                if(acc.link && acc.link !== 'Link Not Found') {
                    fileContent += `${acc.link}\n`;
                }
            });

            const blob = new Blob([fileContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'links.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function previewAccounts() {
            const container = document.getElementById('previewContainer');
            let content = '=== Generated Accounts ===\n\n';
            
            generatedAccounts.forEach((acc, index) => {
                if(acc.email && acc.password) {
                    content += `[Account ${index + 1}]\nEmail: ${acc.email}\nPassword: ${acc.password}\n\n`;
                }
            });
            
            container.innerText = content;
            container.style.display = 'block';
            container.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
